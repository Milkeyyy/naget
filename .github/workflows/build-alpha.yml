name: Build Alpha

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: "Alpha release number (1.0.0-alpha.N)"
        required: true
        type: string
        default: "1"
  pull_request:
    branches: [ "alpha" ]

env:
  RELEASE_CHANNEL: alpha

jobs:

  check:
    name: Build Check
    if: github.event_name == 'pull_request'
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build naget/naget.csproj -c Release

  build:
    name: Build
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [ 'win' ]
        arch: [ 'x64', 'arm64' ]
        runner: [ 'windows-latest' ]
        include:
          - os: osx
            arch: arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    env:
      rid: ${{ matrix.os }}-${{ matrix.arch }}
      OUTPUT_DIR: ./_Pack
      VELOPACK_CHANNEL: ${{ matrix.os }}-${{ matrix.arch }}-alpha

    outputs:
      APP_FULL_VERSION: ${{ steps.version.outputs.app_full_version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Validate Release Number
      shell: pwsh
      run: |
        if ("${{ inputs.release_number }}" -notmatch '^\d+$') {
          throw "release_number must be numeric"
        }

    - name: Load Version
      id: version
      shell: pwsh
      run: |
        $buildInfo = Get-Content "./naget/build.json" | ConvertFrom-Json
        $fullVersion = "$($buildInfo.version)-${{ env.RELEASE_CHANNEL }}.${{ inputs.release_number }}"
        echo "APP_FULL_VERSION=$fullVersion" >> $env:GITHUB_ENV
        echo "app_full_version=$fullVersion" >> $env:GITHUB_OUTPUT

    - name: Create Directory
      shell: pwsh
      run: New-Item -ItemType Directory -ErrorAction SilentlyContinue ${{ env.OUTPUT_DIR }}/${{ env.rid }}

    # ビルド (Windows)
    - if: ${{ startsWith(env.rid, 'win') }}
      name: Build
      run: ./build.cmd --runtime ${{ env.rid }} --releasechannel ${{ env.RELEASE_CHANNEL }} --releasenumber ${{ inputs.release_number }}

    # ビルド (macOS)
    - if: ${{ startsWith(env.rid, 'osx') }}
      name: Build
      run: ./build.sh --runtime ${{ env.rid }} --releasechannel ${{ env.RELEASE_CHANNEL }} --releasenumber ${{ inputs.release_number }}

    - name: Install vpk
      run: dotnet tool install -g vpk --version 1.2.0

    - name: Add dotnet tools to PATH
      run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Create Releases Directory
      shell: pwsh
      run: New-Item -ItemType Directory -ErrorAction SilentlyContinue "${{ env.OUTPUT_DIR }}/${{ env.rid }}/Releases"

    - name: Download Previous Release
      working-directory: ${{ env.OUTPUT_DIR }}/${{ env.rid }}
      continue-on-error: true
      run: vpk download github --repoUrl https://github.com/Milkeyyy/naget --channel ${{ env.VELOPACK_CHANNEL }} --token ${{ secrets.GITHUB_TOKEN }} --pre -o ./Releases

    # パック (Windows)
    - if: ${{ startsWith(env.rid, 'win') }}
      name: Pack
      working-directory: ${{ env.OUTPUT_DIR }}/${{ env.rid }}
      run: vpk pack -u naget -v ${{ env.APP_FULL_VERSION }} -p ./Build -o ./Releases -e naget.exe --channel ${{ env.VELOPACK_CHANNEL }} --packAuthors Milkeyyy -i ../../Logo/naget.ico --noPortable

    # パック (macOS)
    - if: ${{ startsWith(env.rid, 'osx') }}
      name: Pack
      working-directory: ${{ env.OUTPUT_DIR }}/${{ env.rid }}
      run: vpk pack -u naget -v ${{ env.APP_FULL_VERSION }} -p ./Build -o ./Releases -e naget --channel ${{ env.VELOPACK_CHANNEL }} --packAuthors Milkeyyy -i ../../Logo/naget.icns

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: build-${{ env.rid }}
        path: ${{ env.OUTPUT_DIR }}/${{ env.rid }}/Releases/*

  create-release:
    name: Create Alpha Draft Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v8
      with:
        pattern: build-*
        path: ./
        merge-multiple: true

    - name: File List
      run: ls -la ./

    - name: Create Draft Release
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: v${{ needs.build.outputs.APP_FULL_VERSION }}
        name: naget ${{ needs.build.outputs.APP_FULL_VERSION }}
        commit: ${{ github.sha }}
        artifacts: "./*"
        removeArtifacts: true
        prerelease: true
        draft: true
        allowUpdates: true

    - name: Delete Build Artifact
      uses: GeekyEggo/delete-artifact@v6
      with:
        name: build-*
