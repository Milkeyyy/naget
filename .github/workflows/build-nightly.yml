name: Build Nightly

on:
  push:
    branches: [ "dev" ]
  # pull_request:
  #   branches: [ "main" ]

jobs:

  build:
    name: Build
    strategy:
      matrix:
        os: [ 'win' ]
        arch: [ 'x64', 'arm64' ]
        runner: [ 'windows-latest' ]
        include:
          - os: osx
            arch: arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    env:
      rid: ${{ matrix.os }}-${{ matrix.arch }}
      OUTPUT_DIR: ./_Pack
      VELOPACK_CHANNEL: ${{ matrix.os }}-${{ matrix.arch }}-nightly

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Create Directory
      shell: pwsh
      run: New-Item -ItemType Directory -ErrorAction SilentlyContinue ${{ env.OUTPUT_DIR }}/${{ env.rid }}

    - name: Load Build Info
      shell: pwsh
      run: |
        python -c 'print("COMMIT_HASH_SHORT=" + ("${{ github.sha }}"[0:7]))' >> $env:GITHUB_ENV

    # ビルド (Windows)
    - if: ${{ startsWith(env.rid, 'win') }}
      name: Build
      run: ./build.cmd --runtime ${{ env.rid }} --releasechannel nightly --releasenumber ${{ github.run_number }}

    # ビルド (macOS)
    - if: ${{ startsWith(env.rid, 'osx') }}
      name: Build
      run: ./build.sh --runtime ${{ env.rid }} --releasechannel nightly --releasenumber ${{ github.run_number }}


    - name: Load Full Version
      shell: pwsh
      run: |
        $buildInfo = (Get-Content "./naget/build.json" | ConvertFrom-Json)
        echo "APP_FULL_VERSION=$($buildInfo.full_version)" >> $env:GITHUB_ENV


    - name: Install vpk
      run: dotnet tool install -g vpk

    - name: Add dotnet tools to PATH
      run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Create Releases Directory
      shell: pwsh
      run: New-Item -ItemType Directory -ErrorAction SilentlyContinue "${{ env.OUTPUT_DIR }}/${{ env.rid }}/Releases"

    - name: Download Previous Release
      working-directory: ${{ env.OUTPUT_DIR }}/${{ env.rid }}
      continue-on-error: true
      run: vpk download github --repoUrl https://github.com/Milkeyyy/naget --channel ${{ env.VELOPACK_CHANNEL }} --token ${{ secrets.GITHUB_TOKEN }} --pre -o ./Releases

    # パック (Windows)
    - if: ${{ startsWith(env.rid, 'win') }}
      name: Pack
      working-directory: ${{ env.OUTPUT_DIR }}/${{ env.rid }}
      run: vpk pack -u naget -v ${{ env.APP_FULL_VERSION }} -p ./Build -o ./Releases -e naget.exe --channel ${{ env.VELOPACK_CHANNEL }} --packAuthors Milkeyyy -i ../../Logo/naget.ico --noPortable

    # パック (macOS)
    - if: ${{ startsWith(env.rid, 'osx') }}
      name: Pack
      working-directory: ${{ env.OUTPUT_DIR }}/${{ env.rid }}
      run: vpk pack -u naget -v ${{ env.APP_FULL_VERSION }} -p ./Build -o ./Releases -e naget --channel ${{ env.VELOPACK_CHANNEL }} --packAuthors Milkeyyy -i ../../Logo/naget.icns

    # アップロード
    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: build-${{ env.rid }}
        path: |
          ${{ env.OUTPUT_DIR }}/${{ env.rid }}/Releases/*

  update-nightly-release:
    name: Update Nightly Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: ./
          merge-multiple: true

      - name: Update Nightly Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          prerelease: true
          name: "Nightly Build"
          body: |
            Nightly Build - Commit `${{ github.sha }}`
            - ${{ github.event.head_commit.message }}
          files: |
            ./*

      - name: Delete Build Artifact
        uses: GeekyEggo/delete-artifact@v6
        with:
          name: build-*
