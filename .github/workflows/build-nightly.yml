name: Build Nightly

on:
  push:
    branches: [ "dev" ]
  # pull_request:
  #   branches: [ "main" ]

jobs:

  build:
    name: Build
    strategy:
      matrix:
        os: [ 'win' ]
        arch: [ 'x64', 'arm64' ]
        runner: [ 'windows-latest' ]
        include:
          - os: osx
            arch: arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    env:
      rid: ${{ matrix.os }}-${{ matrix.arch }}
      OUTPUT_DIR: ./_Pack
      VELOPACK_CHANNEL: ${{ matrix.os }}-${{ matrix.arch }}-nightly

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Create Directory
      shell: pwsh
      run: New-Item -ItemType Directory -ErrorAction SilentlyContinue ${{ env.OUTPUT_DIR }}/${{ env.rid }}

    - name: Load Build Info
      shell: pwsh
      run: |
        python -c 'print("COMMIT_HASH_SHORT=" + ("${{ github.sha }}"[0:7]))' >> $env:GITHUB_ENV

    # ビルド (Windows)
    - if: ${{ startsWith(env.rid, 'win') }}
      name: Build
      run: ./build.cmd --runtime ${{ env.rid }} --releasechannel nightly --releasenumber ${{ github.run_number }}

    # ビルド (macOS)
    - if: ${{ startsWith(env.rid, 'osx') }}
      name: Build
      run: ./build.sh --runtime ${{ env.rid }} --releasechannel nightly --releasenumber ${{ github.run_number }}


    - name: Load Full Version
      shell: pwsh
      run: |
        $buildInfo = (Get-Content "./naget/build.json" | ConvertFrom-Json)
        echo "APP_FULL_VERSION=$($buildInfo.full_version)" >> $env:GITHUB_ENV


    - name: Install vpk
      run: dotnet tool install -g vpk --version 1.2.161

    - name: Add dotnet tools to PATH
      run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Create Releases Directory
      shell: pwsh
      run: New-Item -ItemType Directory -ErrorAction SilentlyContinue "${{ env.OUTPUT_DIR }}/${{ env.rid }}/Releases"

    # 署名証明書 (自己署名) の取り込み
    - if: ${{ startsWith(env.rid, 'osx') }}
      name: Import Signing Certificate
      env:
        MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      run: |
        if [ -z "${MACOS_CERT_P12}" ]; then
          echo "MACOS_CERT_P12 is not set; the app will be unsigned."
          exit 0
        fi
        KEYCHAIN_PATH="${RUNNER_TEMP}/naget-signing.keychain-db"
        echo -n "${MACOS_CERT_P12}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
        security create-keychain -p naget "${KEYCHAIN_PATH}"
        security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
        security unlock-keychain -p naget "${KEYCHAIN_PATH}"
        security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN_PATH}" -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k naget "${KEYCHAIN_PATH}"
        security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
        security find-certificate -c "naget Self Signed" -p "${KEYCHAIN_PATH}" > "${RUNNER_TEMP}/cert.pem"
        sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "${RUNNER_TEMP}/cert.pem"
        # vpk が固定で付ける --timestamp を外す (自己署名では Apple の TSA を待って止まることがある)
        mkdir -p "${RUNNER_TEMP}/naget-signing/bin"
        cat > "${RUNNER_TEMP}/naget-signing/bin/codesign" <<'EOF'
        #!/bin/bash
        args=()
        for arg in "$@"; do
            if [ "${arg}" != "--timestamp" ]; then
                args+=("${arg}")
            fi
        done
        exec /usr/bin/codesign "${args[@]}"
        EOF
        chmod +x "${RUNNER_TEMP}/naget-signing/bin/codesign"
        echo "${RUNNER_TEMP}/naget-signing/bin" >> "${GITHUB_PATH}"
        echo "VPK_SIGN_APP_IDENTITY=naget Self Signed" >> "${GITHUB_ENV}"
        echo "VPK_KEYCHAIN=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

    - name: Download Previous Release
      working-directory: ${{ env.OUTPUT_DIR }}/${{ env.rid }}
      continue-on-error: true
      run: vpk download github --repoUrl https://github.com/Milkeyyy/naget --channel ${{ env.VELOPACK_CHANNEL }} --token ${{ secrets.GITHUB_TOKEN }} --pre -o ./Releases

    # パック (Windows)
    - if: ${{ startsWith(env.rid, 'win') }}
      name: Pack
      working-directory: ${{ env.OUTPUT_DIR }}/${{ env.rid }}
      run: vpk pack -u naget -v ${{ env.APP_FULL_VERSION }} -p ./Build -o ./Releases -e naget.exe --channel ${{ env.VELOPACK_CHANNEL }} --packAuthors Milkeyyy -i ../../Logo/naget.ico --noPortable

    # パック (macOS)
    - if: ${{ startsWith(env.rid, 'osx') }}
      name: Pack
      working-directory: ${{ env.OUTPUT_DIR }}/${{ env.rid }}
      run: |
        vpk pack -u naget -v ${{ env.APP_FULL_VERSION }} -p ./Build -o ./Releases -e naget --channel ${{ env.VELOPACK_CHANNEL }} --packAuthors Milkeyyy -i ../../Logo/naget.icns --bundleId com.milkeyyy.naget

    # アップロード
    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: build-${{ env.rid }}
        path: |
          ${{ env.OUTPUT_DIR }}/${{ env.rid }}/Releases/*

  update-nightly-release:
    name: Update Nightly Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: repo

      - name: Collect Changes
        id: changes
        working-directory: repo
        shell: bash
        run: |
          if git rev-parse -q --verify refs/tags/nightly >/dev/null; then
            RANGE="nightly..${{ github.sha }}"
          else
            RANGE="-1 ${{ github.sha }}"
          fi
          CHANGES=$(git log $RANGE --no-merges --pretty=format:'%s (`%h`)%n%b%nCOMMIT_END' | awk '
            BEGIN { RS = "COMMIT_END" }
            {
              n = split($0, lines, "\n")
              for (i = 1; i <= n; i++) {
                if (lines[i] == "") continue
                print (seen++ ? "  - " : "- ") lines[i]
              }
              seen = 0
            }')
          [ -z "$CHANGES" ] && CHANGES="No changes"
          {
            echo 'changes<<CHANGES_EOF'
            echo "$CHANGES"
            echo 'CHANGES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Remove Checkout
        run: rm -rf repo

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: ./
          merge-multiple: true

      - name: Update Nightly Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          prerelease: true
          name: "Nightly Build"
          body: |
            Nightly Build - Commit `${{ github.sha }}`

            ## Changes
            ${{ steps.changes.outputs.changes }}
          files: |
            ./*

      - name: Delete Build Artifact
        uses: GeekyEggo/delete-artifact@v6
        with:
          name: build-*
